import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'net.kyori.indra.publishing.sonatype' version '4.0.0'
    id 'net.kyori.indra.publishing' version '4.0.0'
}

def minecraftVersion = '26.1'
def loaderVersion = '0.18.4'
def fabricApiVersion = '0.144.0+26.1'

group = 'me.lucko'
version = '0.7.1'
description = 'A simple permissions API for Fabric'

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    compileOnly "net.fabricmc:fabric-loader:${loaderVersion}"
    compileOnly fabricApi.module("fabric-api-base", fabricApiVersion)
}

processResources {
    inputs.property "version", project.version

    filesMatching('fabric.mod.json') {
        expand "version": project.version
    }

    filteringCharset = 'UTF-8'
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

tasks.named('jar', Jar) {
    doLast {
        def jarPath = archiveFile.get().asFile.toPath()
        java.nio.file.FileSystems.newFileSystem(jarPath, (ClassLoader) null).withCloseable { fs ->
            ['Permissions', 'Options'].each { name ->
                def path = fs.getPath("me/lucko/fabric/api/permissions/v0/${name}.class")
                def reader = new ClassReader(java.nio.file.Files.readAllBytes(path))
                def writer = new ClassWriter(0)
                reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
                    @Override
                    MethodVisitor visitMethod(int access, String methodName, String descriptor, String signature, String[] exceptions) {
                        if (descriptor.contains('Lnet/minecraft/commands/SharedSuggestionProvider;')) {
                            access |= Opcodes.ACC_SYNTHETIC
                        }
                        return super.visitMethod(access, methodName, descriptor, signature, exceptions)
                    }
                }, 0)
                java.nio.file.Files.write(path, writer.toByteArray())
            }
        }
    }
}

indra {
    github("lucko", "fabric-permissions-api") {
        ci(true)
    }
    mitLicense()
    configurePublications {
        from components.java
        pom {
            developers {
                developer {
                    id = 'Luck'
                    url = 'https://lucko.me'
                }
            }
        }
    }
    signWithKeyFromProperties("signingKey", "signingPassword")
}
